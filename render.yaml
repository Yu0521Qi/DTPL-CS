# Render 部署配置（免费版）
# 部署方式：在 Render 后台 New > Web Service > 连接本仓库即可，无需手动填命令。
services:
  - type: web
    name: liquor-pitch-trainer
    runtime: node
    plan: free
    branch: main          # 若你的主分支叫 master，请改成 master
    buildCommand: "npm install"
    startCommand: "npm start"
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "3000"
      # 持久化可选：免费版默认磁盘会在「重新部署」时清空。
      # 若要数据（管理员密码/买家/上游Key）长期保存，建议改用 Railway 挂载持久盘，
      # 或在 Render 付费磁盘里把挂载路径设为 /data 并在此声明 DATA_DIR=/data。
      - key: DATA_DIR
        value: "/data"
